<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم فريق العمل — الزاوية شميس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3EDDF; --panel:#FFFFFF; --panel-2:#F6F1E4;
    --cream:#20291F; --cream-dim:#767F70;
    --gold:#1F6E4A; --gold-dark:#163F2C;
    --cold:#3D84A8; --hold:#3E6DA0;
    --ok:#3E7A3E; --warn:#B07A1F; --bad:#B0463C;
    --shadow:0 10px 26px rgba(32,41,31,.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--cream);font-family:'IBM Plex Sans Arabic',sans-serif;direction:rtl;min-height:100vh;padding-bottom:40px;}
  h1,h2,h3{font-family:'Cairo',sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px;}
  .header{display:flex;align-items:center;gap:12px;margin-bottom:6px;}
  .header h1{font-size:20px;margin:0;}
  .subhead{font-size:12px;color:var(--cream-dim);margin:0 0 16px;}

  .panel{background:var(--panel);border-radius:18px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px;}

  .roster{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .roster-chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid rgba(32,41,31,.08);border-radius:14px;padding:8px 12px;font-size:12.5px;font-weight:700;box-shadow:0 3px 8px rgba(32,41,31,.05);}
  .dot{width:9px;height:9px;border-radius:50%;background:#c9c2b3;flex-shrink:0;}
  .dot.online{background:var(--ok);box-shadow:0 0 0 3px rgba(62,122,62,.18);}
  .roster-rating{margin-inline-start:auto;font-size:11px;color:var(--cream-dim);font-weight:600;}

  label.field{display:block;font-size:12.5px;color:var(--cream-dim);margin:10px 0 5px;font-weight:600;}
  select, input[type=password], input[type=tel]{font-family:inherit;background:var(--panel-2);color:var(--cream);border:1px solid rgba(32,41,31,.15);border-radius:10px;padding:10px 12px;font-size:14px;width:100%;}
  input[type=password]{letter-spacing:6px;text-align:center;font-size:20px;font-weight:800;}
  input[type=number]{font-family:inherit;background:var(--panel-2);color:var(--cream);border:1px solid rgba(32,41,31,.15);border-radius:10px;padding:8px 10px;font-size:13.5px;}

  .btn{width:100%;border:none;padding:12px;border-radius:12px;font-family:inherit;font-weight:800;font-size:14px;cursor:pointer;margin-top:12px;}
  .btn-primary{background:linear-gradient(155deg,var(--gold),var(--gold-dark));color:#fff;}

  .staff-bar{display:flex;align-items:center;justify-content:space-between;background:var(--panel);border-radius:16px;padding:12px 14px;margin-bottom:14px;}
  .staff-who{display:flex;align-items:center;gap:10px;}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;}
  .staff-name{font-weight:800;font-size:14.5px;}
  .staff-logout{background:none;border:none;color:var(--bad);font-size:12px;font-weight:700;cursor:pointer;padding:0;}

  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
  .stat-card{background:var(--panel);border:1px solid rgba(32,41,31,.07);border-radius:14px;padding:10px 4px;text-align:center;}
  .stat-value{font-family:'Cairo';font-weight:900;font-size:19px;}
  .stat-label{font-size:10px;color:var(--cream-dim);margin-top:2px;}
  .st-pending{color:var(--warn);} .st-accepted{color:var(--ok);} .st-delivering{color:var(--cold);} .st-done{color:var(--cream-dim);}

  .order-card{background:var(--panel);border-radius:16px;padding:14px 15px;margin-bottom:12px;border:1px solid rgba(32,41,31,.08);}
  .order-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .order-id{font-size:11px;color:var(--cream-dim);direction:ltr;text-align:right;}
  .status-badge{font-size:10.5px;font-weight:800;padding:4px 10px;border-radius:20px;}
  .st-pending-bg{background:rgba(199,154,59,.18);color:var(--warn);}
  .st-accepted-bg{background:rgba(92,138,92,.18);color:var(--ok);}
  .st-delivering-bg{background:rgba(61,132,168,.18);color:var(--cold);}
  .st-hold-bg{background:rgba(91,127,166,.18);color:var(--hold);}
  .st-rejected-bg{background:rgba(194,90,80,.18);color:var(--bad);}
  .st-done-bg{background:rgba(32,41,31,.1);color:var(--cream-dim);}
  .order-customer{font-size:13px;font-weight:700;margin-bottom:4px;}
  .order-note{font-size:11.5px;color:var(--cream-dim);margin-bottom:4px;}
  .order-delivery{font-size:11.5px;color:var(--gold-dark);font-weight:700;margin-bottom:8px;}
  .order-items{list-style:none;margin:0 0 10px;padding:0;}
  .order-items li{font-size:12.5px;color:var(--cream-dim);padding:3px 0;}
  .order-items li b{color:var(--cream);}
  .claim-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
  .claim-btn{flex:1;min-width:80px;border:none;padding:9px 6px;border-radius:10px;font-family:inherit;font-weight:800;font-size:12px;cursor:pointer;}
  .cb-accept{background:var(--ok);color:#fff;}
  .cb-hold{background:var(--hold);color:#fff;}
  .cb-reject{background:var(--bad);color:#fff;}
  .cb-deliver{background:var(--cold);color:#fff;}
  .cb-done{background:var(--gold);color:#fff;}
  .cb-delete{background:none;border:1px solid var(--bad);color:var(--bad);}
  .claimed-line{font-size:12px;color:var(--cream-dim);margin-bottom:6px;}
  .claimed-line b{color:var(--cream);}
  .row-line{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .row-line select{flex:1;min-width:0;}

  .empty-state{text-align:center;padding:40px 12px;color:var(--cream-dim);font-size:13px;}

  .price-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(32,41,31,.06);}
  .price-item:last-child{border-bottom:none;}
  .price-item span{flex:1;font-size:13px;font-weight:700;}
  .price-item input[type=number]{width:80px;text-align:center;}
  .price-cat-title{font-size:13px;font-weight:800;color:var(--gold-dark);margin:14px 0 4px;}
  .price-cat-title:first-child{margin-top:0;}
  .hide-toggle{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--cream-dim);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold-dark);color:#fff;padding:11px 18px;border-radius:30px;font-size:13px;font-weight:700;box-shadow:var(--shadow);z-index:80;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
</style>
</head>
<body>

<div class="wrap">
  <div class="header"><h1>☕ لوحة فريق العمل</h1></div>
  <p class="subhead">بوفيه الزاوية شميس — هذه الصفحة لفريق العمل فقط</p>

  <!-- أي زائر يشوف مين متواجد وتقييمه بس، من غير أي تفاصيل طلبات -->
  <div class="roster" id="roster"></div>

  <!-- شاشة الدخول -->
  <div class="panel" id="loginPanel">
    <h3 style="margin:0 0 4px">تسجيل الدخول</h3>
    <p style="color:var(--cream-dim);font-size:12.5px;margin:0">اختر اسمك، أكّد رقم واتسابك، وادخل رقمك السري المكوّن من 4 أرقام</p>
    <label class="field">اسمك</label>
    <select id="memberSelect"><option value="">-- اختر اسمك --</option></select>
    <div id="waArea"></div>
    <div id="pinArea"></div>
  </div>

  <!-- لوحة التحكم — تظهر بعد تسجيل الدخول بس -->
  <div id="dashboard" style="display:none;">
    <div class="staff-bar">
      <div class="staff-who">
        <span class="avatar" id="avatarLetter"></span>
        <div>
          <div class="staff-name" id="welcomeName"></div>
          <button class="staff-logout" id="logoutBtn">إنهاء الدوام / تسجيل الخروج</button>
        </div>
      </div>
    </div>

    <div class="stats-row" id="statsRow"></div>
    <div id="ordersList"></div>

    <div class="panel" id="pricePanel" style="display:none;">
      <h3 style="margin:0 0 10px">تعديل الأسعار وإخفاء/إظهار المنتجات</h3>
      <div id="priceEditorBody"></div>
      <button class="btn btn-primary" id="savePricesBtn">حفظ كل التعديلات</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="menu-data.js"></script>
<script>
let db, fs;
let myName = null;
let myPhoneVerified = false;
let ordersUnsub = null;
let PRICES = {};
let ratingsMap = {};

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

/* ===================== FIRESTORE INIT ===================== */
async function initFirestore(){
  const cfgMod = await import('./firebase-config.js');
  db = cfgMod.db;
  fs = await import('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js');

  const sel = document.getElementById('memberSelect');
  TEAM.forEach(m=>{
    const o = document.createElement('option');
    o.value = m.name; o.textContent = m.name;
    sel.appendChild(o);
  });
  sel.onchange = onMemberSelected;

  fs.onSnapshot(fs.collection(db,'team_status'), (snap)=>{
    const statusMap = {};
    snap.forEach(d=> statusMap[d.id] = d.data());
    renderRoster(statusMap);
  });

  fs.onSnapshot(fs.collection(db,'ratings'), (snap)=>{
    ratingsMap = {};
    snap.forEach(d=> ratingsMap[d.id] = d.data());
  });

  const saved = localStorage.getItem('teamMember');
  if(saved && TEAM.some(t=>t.name===saved)){
    myName = saved;
    await markOnline(true);
    showDashboard();
  }
}

function renderRoster(statusMap){
  const roster = document.getElementById('roster');
  roster.innerHTML = '';
  TEAM.forEach(m=>{
    const online = !!(statusMap[m.name] && statusMap[m.name].online);
    const r = ratingsMap[m.name];
    const avg = r && r.count ? (r.sum / r.count).toFixed(1) : '—';
    const chip = document.createElement('div');
    chip.className = 'roster-chip';
    chip.innerHTML = `<span class="dot ${online?'online':''}"></span> ${m.name} <span class="roster-rating">★ ${avg}</span>`;
    roster.appendChild(chip);
  });
}

/* ===================== LOGIN: الاسم ← رقم الواتساب ← الرقم السري ===================== */
function onMemberSelected(){
  const name = document.getElementById('memberSelect').value;
  document.getElementById('waArea').innerHTML = '';
  document.getElementById('pinArea').innerHTML = '';
  myPhoneVerified = false;
  if(!name) return;

  const waArea = document.getElementById('waArea');
  waArea.innerHTML = `
    <label class="field">أكّد رقم واتسابك المسجّل</label>
    <input type="tel" id="waEnter" placeholder="مثال: 01021776980">
    <button class="btn btn-primary" id="waSubmitBtn">تأكيد الرقم</button>
  `;
  document.getElementById('waSubmitBtn').onclick = ()=> verifyPhone(name);
}

function verifyPhone(name){
  const entered = normalizePhone(document.getElementById('waEnter').value);
  const member = TEAM.find(t=>t.name===name);
  const expected = normalizePhone(member.phone);
  if(entered !== expected){ toast('رقم الواتساب مش مطابق للرقم المسجّل باسمك'); return; }
  myPhoneVerified = true;
  showPinStep(name);
}

async function showPinStep(name){
  const area = document.getElementById('pinArea');
  const authSnap = await fs.getDoc(fs.doc(db,'team_auth',name));
  if(!authSnap.exists()){
    area.innerHTML = `
      <p style="font-size:12px;color:var(--cream-dim);margin:10px 0 0">مفيش رقم سري متسجل لاسمك لسه — كلّم الإدارة تظبطلك واحد أول.</p>
    `;
    return;
  }
  area.innerHTML = `
    <label class="field">رقمك السري</label>
    <input type="password" id="pinEnter" inputmode="numeric" maxlength="4" placeholder="••••">
    <button class="btn btn-primary" id="pinSubmitBtn">تسجيل الدخول وبدء الدوام</button>
  `;
  document.getElementById('pinSubmitBtn').onclick = ()=> checkPin(name, authSnap.data().pin);
}

async function checkPin(name, correctPin){
  const entered = document.getElementById('pinEnter').value.trim();
  if(entered !== correctPin){ toast('الرقم السري غلط'); return; }
  await loginSuccess(name);
}

async function loginSuccess(name){
  myName = name;
  localStorage.setItem('teamMember', name);
  await markOnline(true);
  showDashboard();
  toast('أهلاً ' + name);
}

async function markOnline(state){
  const me = TEAM.find(t=>t.name===myName);
  await fs.setDoc(fs.doc(db,'team_status',myName), {
    name: myName, phone: me ? me.phone : '', online: state, lastSeen: fs.serverTimestamp()
  }, { merge:true });
}

document.getElementById('logoutBtn').addEventListener('click', async ()=>{
  await markOnline(false);
  localStorage.removeItem('teamMember');
  if(ordersUnsub) ordersUnsub();
  myName = null;
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('loginPanel').style.display = 'block';
  document.getElementById('memberSelect').value = '';
  document.getElementById('waArea').innerHTML = '';
  document.getElementById('pinArea').innerHTML = '';
});

/* ===================== DASHBOARD ===================== */
function showDashboard(){
  document.getElementById('loginPanel').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('avatarLetter').textContent = myName[0];
  document.getElementById('welcomeName').textContent = myName + ' (متواجد الآن)';

  if(PRICE_EDITOR_NAMES.includes(myName)){
    document.getElementById('pricePanel').style.display = 'block';
    renderPriceEditor();
  }

  const q = fs.query(fs.collection(db,'orders'), fs.orderBy('createdAt','desc'));
  ordersUnsub = fs.onSnapshot(q, (snap)=>{
    const orders = [];
    snap.forEach(d=> orders.push({ id:d.id, ...d.data() }));
    renderStats(orders);
    renderOrders(orders);
  });
}

const STATUS_LABEL = {
  pending:{cls:'st-pending-bg', text:'جديد'}, accepted:{cls:'st-accepted-bg', text:'قيد التجهيز'},
  delivering:{cls:'st-delivering-bg', text:'جاري التوصيل'},
  hold:{cls:'st-hold-bg', text:'معلّق'}, rejected:{cls:'st-rejected-bg', text:'مرفوض'}, done:{cls:'st-done-bg', text:'مكتمل'},
  deleted:{cls:'st-done-bg', text:'محذوف'},
};
const HISTORY_LABEL = {
  accepted:'قبِل الطلب (قيد التجهيز)', delivering:'بدأ توصيل الطلب', hold:'علّق الطلب', rejected:'رفض الطلب',
  done:'أكمل تسليم الطلب', deleted:'حذف الطلب', transferred:'حوّل الطلب',
};
function historyLine(h){
  const who = HISTORY_LABEL[h.action] || h.action;
  const t = h.time ? new Date(h.time).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}) : '';
  if(h.action==='transferred') return `${h.by} حوّل الطلب إلى ${h.to} — ${t}`;
  return `${h.by} ${who} — ${t}`;
}

function renderStats(orders){
  const row = document.getElementById('statsRow');
  const counts = { pending:0, accepted:0, delivering:0, done:0 };
  orders.forEach(o=>{ if(counts[o.status]!==undefined) counts[o.status]++; });
  const stats = [
    { label:'جديد', value:counts.pending, cls:'st-pending' },
    { label:'قيد التجهيز', value:counts.accepted, cls:'st-accepted' },
    { label:'جاري التوصيل', value:counts.delivering, cls:'st-delivering' },
    { label:'مكتمل', value:counts.done, cls:'st-done' },
  ];
  row.innerHTML = stats.map(s=>`<div class="stat-card"><div class="stat-value ${s.cls}">${s.value}</div><div class="stat-label">${s.label}</div></div>`).join('');
}

function renderOrders(orders){
  const container = document.getElementById('ordersList');
  const visible = orders.filter(o=>o.status!=='deleted');
  if(!visible.length){
    container.innerHTML = `<div class="empty-state">لا توجد طلبات حتى الآن</div>`;
    return;
  }
  container.innerHTML = '';
  visible.forEach(order=>{
    const st = STATUS_LABEL[order.status] || STATUS_LABEL.pending;
    const card = document.createElement('div');
    card.className = 'order-card';
    const timeStr = order.createdAt && order.createdAt.toDate ? order.createdAt.toDate().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}) : '';
    card.innerHTML = `
      <div class="order-head"><span class="status-badge ${st.cls}">${st.text}</span><span class="order-id">${timeStr} · #${order.id.slice(-5)}</span></div>
      <div class="order-customer">${order.customer||'عميل'}</div>
      ${order.note ? `<div class="order-note">${order.note}</div>` : ''}
      ${order.sentViaWhatsappTo ? `<div class="order-delivery">تم إرسال الطلب عبر واتساب إلى: ${order.sentViaWhatsappTo.name}</div>` : ''}
      <ul class="order-items">${(order.items||[]).map(i=>{ const bits=[i.extra,i.sugar].filter(Boolean).join('، '); return `<li><b>${i.name}</b> ×${i.qty}${bits? ' — '+bits:''}</li>`; }).join('')}</ul>
    `;

    function addTransferControl(){
      const others = TEAM.filter(t=>t.name!==myName);
      const line = document.createElement('div');
      line.className = 'row-line';
      line.innerHTML = `<select>${others.map(o=>`<option value="${o.name}">${o.name}</option>`).join('')}</select><button class="claim-btn cb-hold" style="flex:0 0 auto;min-width:60px">تحويل</button>`;
      const sel = line.querySelector('select');
      line.querySelector('button').onclick = ()=>updateOrder(order.id,'transfer',{to:sel.value});
      card.appendChild(line);
    }

    const actionZone = document.createElement('div');
    actionZone.className = 'claim-row';
    // أي عضو فريق مسجّل دخول يقدر يقبل/يعلّق/يرفض أي طلب — بصرف النظر عن مين استلم رسالة الواتساب
    if(order.status === 'pending'){
      actionZone.innerHTML = `<button class="claim-btn cb-accept">قبول</button><button class="claim-btn cb-hold">تعليق</button><button class="claim-btn cb-reject">رفض</button>`;
      const [a,h,r] = actionZone.querySelectorAll('button');
      a.onclick=()=>updateOrder(order.id,'accepted'); h.onclick=()=>updateOrder(order.id,'hold'); r.onclick=()=>updateOrder(order.id,'rejected');
      if(order.history && order.history.length){
        const l=document.createElement('div'); l.className='claimed-line';
        l.textContent = historyLine(order.history[order.history.length-1]);
        card.appendChild(l);
      }
      card.appendChild(actionZone);
    } else if(order.status === 'hold'){
      actionZone.innerHTML = `<button class="claim-btn cb-accept">قبول</button><button class="claim-btn cb-reject">رفض</button>`;
      const [a,r] = actionZone.querySelectorAll('button');
      a.onclick=()=>updateOrder(order.id,'accepted'); r.onclick=()=>updateOrder(order.id,'rejected');
      const l=document.createElement('div'); l.className='claimed-line';
      l.innerHTML = `معلّق بواسطة <b>${order.claimedBy||'-'}</b>`; card.appendChild(l);
      card.appendChild(actionZone);
    } else if(order.status === 'accepted'){
      const l=document.createElement('div'); l.className='claimed-line';
      l.innerHTML = `قيد التجهيز بواسطة <b>${order.claimedBy}</b>`; card.appendChild(l);
      if(order.claimedBy === myName){
        actionZone.innerHTML = `<button class="claim-btn cb-deliver">بدء التوصيل</button>`;
        actionZone.querySelector('button').onclick = ()=>updateOrder(order.id,'delivering');
        card.appendChild(actionZone);
        addTransferControl();
      }
    } else if(order.status === 'delivering'){
      const l=document.createElement('div'); l.className='claimed-line';
      l.innerHTML = `جاري التوصيل بواسطة <b>${order.claimedBy}</b>`; card.appendChild(l);
      if(order.claimedBy === myName){
        actionZone.innerHTML = `<button class="claim-btn cb-done">تم التسليم</button>`;
        actionZone.querySelector('button').onclick = ()=>updateOrder(order.id,'done');
        card.appendChild(actionZone);
        addTransferControl();
      }
    } else if(order.status === 'rejected'){
      const l=document.createElement('div'); l.className='claimed-line';
      l.innerHTML = `تم الرفض بواسطة <b>${order.claimedBy}</b>`; card.appendChild(l);
    } else if(order.status === 'done'){
      const l=document.createElement('div'); l.className='claimed-line';
      l.innerHTML = `اكتمل بواسطة <b>${order.claimedBy}</b>`; card.appendChild(l);
    }

    if(order.status !== 'done'){
      const delBtn = document.createElement('button');
      delBtn.className = 'claim-btn cb-delete';
      delBtn.style.marginTop = '8px';
      delBtn.textContent = 'حذف الطلب';
      delBtn.onclick = ()=>updateOrder(order.id,'delete');
      card.appendChild(delBtn);
    }
    container.appendChild(card);
  });
}

async function updateOrder(orderId, action, extra){
  const ref = fs.doc(db,'orders',orderId);
  const time = new Date().toISOString();
  let historyEntry, patch;

  if(action==='done'){
    historyEntry = {action:'done', by:myName, time};
    patch = { status:'done' };
  } else if(action==='delete'){
    historyEntry = {action:'deleted', by:myName, time};
    patch = { status:'deleted' };
  } else if(action==='transfer'){
    historyEntry = {action:'transferred', by:myName, to:extra.to, time};
    patch = { status:'pending', claimedBy:null };
  } else {
    historyEntry = {action, by:myName, time};
    patch = { status:action, claimedBy:myName, claimedAt:time };
  }

  await fs.updateDoc(ref, { ...patch, history: fs.arrayUnion(historyEntry) });
  toast('تم تحديث حالة الطلب');
}

/* ===================== PRICE + HIDE EDITOR (مظهر علي وحسن ابو عمر فقط) ===================== */
async function renderPriceEditor(){
  const body = document.getElementById('priceEditorBody');
  const snap = await fs.getDoc(fs.doc(db,'prices','menu'));
  PRICES = snap.exists() ? snap.data() : {};
  body.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const h = document.createElement('div');
    h.className = 'price-cat-title';
    h.textContent = cat.title;
    body.appendChild(h);
    cat.items.forEach(name=>{
      const current = PRICES[name] || {};
      const row = document.createElement('div');
      row.className = 'price-item';
      row.innerHTML = `
        <span>${name}</span>
        <input type="number" min="0" step="1" data-item="${name}" data-field="price" value="${current.price ?? ''}" placeholder="السعر">
        <label class="hide-toggle"><input type="checkbox" data-item="${name}" data-field="hidden" ${current.hidden ? 'checked' : ''}> إخفاء</label>
      `;
      body.appendChild(row);
    });
  });
}

document.getElementById('savePricesBtn').addEventListener('click', async ()=>{
  const priceInputs = document.querySelectorAll('#priceEditorBody input[data-field="price"]');
  const hideInputs = document.querySelectorAll('#priceEditorBody input[data-field="hidden"]');
  const map = {};
  priceInputs.forEach(inp=>{
    const name = inp.dataset.item;
    map[name] = map[name] || {};
    if(inp.value.trim() !== '') map[name].price = Number(inp.value.trim());
  });
  hideInputs.forEach(inp=>{
    const name = inp.dataset.item;
    map[name] = map[name] || {};
    map[name].hidden = inp.checked;
  });
  await fs.setDoc(fs.doc(db,'prices','menu'), map, { merge:true });
  toast('تم حفظ التعديلات');
});
